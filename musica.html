<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musica Roma</title>

<style>
body{
    margin:0;
    font-family:Georgia,serif;
    background:#f4e1c1;
    text-align:center;
    color:#4b2e1e;
}

header{
    background:#d4b483;
    padding:20px;
    border-bottom:5px solid #8b5e3c;
}

#piano{
    margin:40px auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

.key{
    width:60px;
    height:220px;
    margin:2px;
    background:white;
    border:2px solid #8b5e3c;
    border-radius:8px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    transition:0.1s;
}

.key:active{
    background:#e6c89f;
    transform:scale(0.98);
}

#back{
    display:inline-block;
    margin:15px;
    padding:10px 15px;
    background:#8b5e3c;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>🎹 Musica Roma</h1>
</header>

<a id="back" href="lorem.html">⬅ Powrót</a>

<div id="piano">
    <div class="key" onclick="play('C4')">C</div>
    <div class="key" onclick="play('D4')">D</div>
    <div class="key" onclick="play('E4')">E</div>
    <div class="key" onclick="play('F4')">F</div>
    <div class="key" onclick="play('G4')">G</div>
    <div class="key" onclick="play('A4')">A</div>
    <div class="key" onclick="play('B4')">B</div>
    <div class="key" onclick="play('C5')">C</div>
</div>

<script>
const ctx = new (window.AudioContext || window.webkitAudioContext)();

/* prawdziwe częstotliwości pianina */
const freq = {
    C4: 261.63,
    D4: 293.66,
    E4: 329.63,
    F4: 349.23,
    G4: 392.00,
    A4: 440.00,
    B4: 493.88,
    C5: 523.25
};

function play(note){

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine"; // możesz zmienić na "triangle" dla miększego brzmienia
    osc.frequency.value = freq[note];

    gain.gain.value = 0.2;

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.4);
}

/* klawiatura */
document.addEventListener("keydown",(e)=>{

const map = {
a:"C4",
s:"D4",
d:"E4",
f:"F4",
g:"G4",
h:"A4",
j:"B4",
k:"C5"
};

if(map[e.key]){
play(map[e.key]);
}

});
</script>

</body>
</html>
