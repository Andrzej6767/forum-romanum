<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasyno</title>

<style>
body{
    margin:0;
    font-family:Georgia,serif;
    background:#f4e1c1;
    color:#4b2e1e;
    text-align:center;
}

header{
    background:#d4b483;
    padding:20px;
    border-bottom:5px solid #8b5e3c;
}

#casino{
    margin:30px auto;
    padding:20px;
    width:90%;
    max-width:500px;
    background:#e6c89f;
    border-radius:12px;
    border:2px solid #8b5e3c;
}

#slots{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:20px 0;
}

.slot{
    width:70px;
    height:70px;
    background:#fff3dc;
    border:2px solid #8b5e3c;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#8b5e3c;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

a{
    display:inline-block;
    margin:10px;
    padding:10px 15px;
    background:#8b5e3c;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>🎰 Kasyno Romanum</h1>
</header>

<a href="Login.html">⬅ Powrót</a>

<div id="casino">
    <h2>Twoje monety: <span id="coins">0</span> 🪙</h2>

    <div id="slots">
        <div class="slot">❔</div>
        <div class="slot">❔</div>
        <div class="slot">❔</div>
    </div>

    <button id="spinBtn" onclick="spin()">Losuj (1x / 24h)</button>

    <p id="info"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
authDomain:"dupa-a6aa0.firebaseapp.com",
databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",
projectId:"dupa-a6aa0",
storageBucket:"dupa-a6aa0.firebasestorage.app",
messagingSenderId:"782529996845",
appId:"1:782529996845:web:277ff4fcf6f4db846cf0a4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const user = localStorage.getItem("nickname");

const coinsEl = document.getElementById("coins");
const info = document.getElementById("info");
const spinBtn = document.getElementById("spinBtn");
const slotEls = document.querySelectorAll(".slot");

const symbols = ["🍇","🍒","🍋","⭐","💎"];

const userRef = ref(db, "users/" + user);

async function loadUser(){
    const snap = await get(userRef);
    if(!snap.exists()){
        await set(userRef,{
            coins:0,
            lastSpin:0
        });
    }

    const data = (await get(userRef)).val();
    coinsEl.textContent = data.coins || 0;
}

function randomSymbol(){
    return symbols[Math.floor(Math.random()*symbols.length)];
}

function sleep(ms){
    return new Promise(r => setTimeout(r, ms));
}

window.spin = async function(){

    const snap = await get(userRef);
    const data = snap.val();

    const now = Date.now();
    const last = data.lastSpin || 0;

    if(now - last < 24*60*60*1000){
        info.textContent = "⏳ Możesz grać tylko raz na 24h!";
        return;
    }

    spinBtn.disabled = true;
    info.textContent = "🎰 Losowanie...";

    // animacja
    for(let i=0;i<10;i++){
        slotEls.forEach(s => s.textContent = randomSymbol());
        await sleep(100);
    }

    const result = [
        randomSymbol(),
        randomSymbol(),
        randomSymbol()
    ];

    slotEls.forEach((s,i)=> s.textContent = result[i]);

    let reward = 0;

    if(result[0] === result[1] && result[1] === result[2]){
        reward = 1;
        info.textContent = "🎉 WYGRANA! +1 moneta";
    } else {
        info.textContent = "😢 Brak wygranej";
    }

    await update(userRef,{
        coins: (data.coins || 0) + reward,
        lastSpin: now
    });

    coinsEl.textContent = (data.coins || 0) + reward;

    spinBtn.disabled = false;
};

loadUser();
</script>

</body>
</html>
