<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Praemium Romanum</title>

<style>

body{
margin:0;
font-family:Georgia,serif;
background:#f4e1c1;
background-image:url('https://www.transparenttextures.com/patterns/papyrus.png');
color:#4b2e1e;
}

header{
background:#d4b483;
padding:20px;
text-align:center;
border-bottom:5px solid #8b5e3c;
}

.container{
max-width:700px;
margin:20px auto;
}

.item{
background:#e6c89f;
padding:15px;
margin:10px 0;
border-radius:12px;
border-left:5px solid #8b5e3c;
}

button{
padding:8px 14px;
border:none;
border-radius:8px;
background:#8b5e3c;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>💰 Praemium Romanum</h1>
<div>🪙 <span id="coins">0</span></div>
</header>

<a href="Login.html">⬅ Powrót</a>

<div class="container">

<div class="item">
⭐ Gwiazda — 5 🪙
<button onclick="buy('star',5)">Kup</button>
</div>

<div class="item">
❤️ Fan Romka — 10 🪙
<button onclick="buy('fan',10)">Kup</button>
</div>

<div class="item">
👑 Korona — 15 🪙
<button onclick="buy('crown',15)">Kup</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({
apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
authDomain:"dupa-a6aa0.firebaseapp.com",
databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",
projectId:"dupa-a6aa0",
storageBucket:"dupa-a6aa0.firebasestorage.app",
messagingSenderId:"782529996845",
appId:"1:782529996845:web:277ff4fcf6f4db846cf0a4"
});

const db=getDatabase(app);
const user=localStorage.getItem("nickname");

const userRef=ref(db,"users/"+user);

async function load(){
const snap=await get(userRef);
document.getElementById("coins").innerText=snap.val()?.coins||0;
}

load();

window.buy=async function(item,cost){

const snap=await get(userRef);
const data=snap.val();

if((data.coins||0)<cost){
alert("Za mało monet!");
return;
}

let badge=data.badge||"";

if(item==="star")badge="⭐";
if(item==="fan")badge="❤️ Fan Romka";
if(item==="crown")badge="👑";

await update(userRef,{
coins:(data.coins||0)-cost,
badge
});

load();
alert("Kupiono!");
};

</script>

</body>
</html>
