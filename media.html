<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media Romanum</title>

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');
    color: #4b2e1e;
}

header {
    background-color: #d4b483;
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
}

header h1 {
    margin: 0;
    font-size: 2.5rem;
}

.back {
    display: inline-block;
    margin: 20px;
    text-decoration: none;
    color: #4b2e1e;
    font-weight: bold;
}

#postForm {
    max-width: 700px;
    margin: 20px auto;
    background: #e6c89f;
    padding: 20px;
    border-radius: 10px;
}

textarea {
    width: 100%;
    height: 100px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    resize: none;
    box-sizing: border-box;
    font-size: 16px;
}

input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    margin-top: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background-color: #8b5e3c;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #6f472d;
}

#posts {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.post {
    background: #e6c89f;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    border-left: 5px solid #8b5e3c;
}

.post img {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
}

.meta {
    font-size: 14px;
    margin-bottom: 10px;
}

.reactions {
    margin-top: 10px;
}

.reactions button {
    margin-right: 10px;
}

</style>
</head>

<body>

<header>
    <h1>🏺 Media Romanum</h1>
</header>

<a class="back" href="Login.html">
    ⬅ Powrót
</a>

<div id="postForm">

    <textarea
        id="postText"
        placeholder="Napisz post..."
    ></textarea>

    <input
        type="text"
        id="imageUrl"
        placeholder="Wklej link do zdjęcia (opcjonalnie)"
    >

    <button onclick="addPost()">
        Dodaj post
    </button>

</div>

<div id="posts"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    update,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",

  authDomain: "dupa-a6aa0.firebaseapp.com",

  databaseURL: "https://dupa-a6aa0-default-rtdb.firebaseio.com",

  projectId: "dupa-a6aa0",

  storageBucket: "dupa-a6aa0.firebasestorage.app",

  messagingSenderId: "782529996845",

  appId: "1:782529996845:web:277ff4fcf6f4db846cf0a4"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const postsRef = ref(db, "posts");

/* DODAWANIE POSTA */

window.addPost = function() {

    const text =
    document.getElementById("postText").value;

    const image =
    document.getElementById("imageUrl").value;

    if(text.trim() === "") return;

    const nickname =
    localStorage.getItem("nickname") || "Anonim";

    const now = new Date();

    const date =
    now.toLocaleDateString("pl-PL")
    + " " +
    now.getHours().toString().padStart(2, '0')
    + ":" +
    now.getMinutes().toString().padStart(2, '0');

    push(postsRef, {

        nickname,
        text,
        image,
        date,

        likes: 0,
        dislikes: 0,

        voters: {}
    });

    document.getElementById("postText").value = "";
    document.getElementById("imageUrl").value = "";
};

/* WYŚWIETLANIE POSTÓW */

onChildAdded(postsRef, (data) => {

    const post = data.val();

    const div =
    document.createElement("div");

    div.classList.add("post");

    div.innerHTML = `

        <div class="meta">

            <strong>
                ${post.nickname}
            </strong>

            • ${post.date}

        </div>

        <div>
            ${post.text}
        </div>

        ${post.image
            ? `<img src="${post.image}">`
            : ""
        }

        <div class="reactions">

            <button onclick="react('${data.key}','likes')">
                👍 ${post.likes || 0}
            </button>

            <button onclick="react('${data.key}','dislikes')">
                👎 ${post.dislikes || 0}
            </button>

        </div>

    `;

    document
    .getElementById("posts")
    .prepend(div);
});

/* REAKCJE */

window.react = function(id, type) {

    const nickname =
    localStorage.getItem("nickname") || "Anonim";

    const postRef =
    ref(db, "posts/" + id);

    get(postRef).then((snap) => {

        const data = snap.val();

        if (!data.voters) {
            data.voters = {};
        }

        /* SPRAWDZANIE */

        if (data.voters[nickname]) {

            alert(
                "Już głosowałeś na ten post!"
            );

            return;
        }

        /* UPDATE */

        const updateData = {};

        updateData[type] =
        (data[type] || 0) + 1;

        updateData[
            "voters/" + nickname
        ] = true;

        update(postRef, updateData);

        location.reload();
    });
};

</script>

</body>
</html>
