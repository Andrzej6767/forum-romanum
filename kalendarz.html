<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalendarz Imperium</title>

<style>

body {

    margin: 0;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    font-family: Georgia, serif;

    background-color: #f4e1c1;
    background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');

    color: #4b2e1e;

    text-align: center;
}

h1 {
    font-size: 3rem;
}

#date {
    font-size: 1.5rem;
    margin-top: 20px;
}

#quote {
    margin-top: 30px;
    max-width: 700px;
    font-size: 1.3rem;
    font-style: italic;
    padding: 20px;
    background: rgba(255,255,255,0.4);
    border-radius: 10px;
}

a {
    margin-top: 40px;
    padding: 12px 20px;
    background: #d4b483;
    border: 2px solid #8b5e3c;
    border-radius: 8px;
    text-decoration: none;
    color: #4b2e1e;
    font-weight: bold;
}

a:hover {
    background: #caa26f;
}

</style>
</head>

<body>

<h1>📅 Kalendarz Imperium</h1>

<div id="date"></div>

<div id="quote"></div>

<a href="Login.html">⬅ Powrót</a>

<script>

/* DATA */

const now = new Date();

document.getElementById("date").innerHTML =
now.toLocaleDateString("pl-PL", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
});

/* CYTATY */

const quotes = [
"Alea iacta est. – Cezar",
"Veni, vidi, vici.",
"Fortuna sprzyja odważnym.",
"Roma invicta!",
"Siła i honor.",
"Czas buduje i niszczy imperia.",
"Imperium trwa dzięki ludziom."
];

document.getElementById("quote").innerHTML =
quotes[Math.floor(Math.random() * quotes.length)];


function applyTheme(){
const theme=localStorage.getItem("theme");

if(theme==="dark"){
document.body.style.backgroundColor="#111";
document.body.style.color="#fff";
}
}

applyTheme();
</script>

</body>
</html>
