<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem Mentis Romani</title>

<style>
body{
    margin:0;
    font-family:Georgia,serif;
    background:#f4e1c1;
    background-image:url('https://www.transparenttextures.com/patterns/papyrus.png');
    color:#4b2e1e;
}

header{
    background:#d4b483;
    padding:20px;
    text-align:center;
    border-bottom:5px solid #8b5e3c;
}

.post{
    max-width:700px;
    margin:15px auto;
    background:#e6c89f;
    padding:15px;
    border-radius:12px;
    border-left:5px solid #8b5e3c;
}

textarea,input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    background:#8b5e3c;
    color:white;
    border:none;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
}

img{
    width:100%;
    margin-top:10px;
    border-radius:10px;
}

#block{
    text-align:center;
    font-size:22px;
    margin-top:50px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>📜 Lorem Mentis Romani</h1>
</header>

<a href="Login.html" style="display:inline-block;margin:10px;padding:10px 15px;background:#8b5e3c;color:white;text-decoration:none;border-radius:8px;">
⬅ Powrót
</a>

<div id="block">Sprawdzanie IQ...</div>

<div id="content" style="display:none;">

<div class="post">
<textarea id="text" placeholder="Napisz coś..."></textarea>
<input type="file" id="file">
<button onclick="post()">Dodaj post</button>
</div>

<div id="posts"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, push, onChildAdded, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
authDomain:"dupa-a6aa0.firebaseapp.com",
databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",
projectId:"dupa-a6aa0",
storageBucket:"dupa-a6aa0.firebasestorage.app",
messagingSenderId:"782529996845",
appId:"1:782529996845:web:277ff4fcf6f4db846cf0a4"
});

const db = getDatabase(app);
const user = localStorage.getItem("nickname");

if(!user){
window.location.href="index.html";
}

const userRef = ref(db,"users/"+user);

/* 🔒 BLOKADA IQ */
async function checkIQ(){

const snap = await get(userRef);
const data = snap.val();

const iq = data?.iq || 60;

if(iq < 140){

document.getElementById("block").innerText =
"❌ Wymagane 140 IQ";

return;
}

document.getElementById("block").style.display="none";
document.getElementById("content").style.display="block";

loadPosts();
}

checkIQ();

/* CLOUDINARY */
const CLOUD_NAME="dqoqromys";
const UPLOAD_PRESET="forum_upload";

async function upload(file){

const fd = new FormData();
fd.append("file",file);
fd.append("upload_preset",UPLOAD_PRESET);

const res = await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
{method:"POST",body:fd}
);

const data = await res.json();
return data.secure_url;

}

/* POST */
window.post = async function(){

const text = document.getElementById("text").value;
const file = document.getElementById("file").files[0];

if(!text.trim() && !file) return;

let img="";

if(file){
img = await upload(file);
}

push(ref(db,"lorem_posts"),{
user,
text,
img,
time:Date.now(),
likes:{}
});

document.getElementById("text").value="";
document.getElementById("file").value="";
};

/* LOAD */
function loadPosts(){

onChildAdded(ref(db,"lorem_posts"), async (snap)=>{

const id = snap.key;
const d = snap.val();

const uSnap = await get(ref(db,"users/"+d.user));
const u = uSnap.val() || {};

const color = u.color || "#4b2e1e";

const date = new Date(d.time).toLocaleString("pl-PL");

const likes = Object.keys(d.likes||{}).length;

const div = document.createElement("div");
div.classList.add("post");

div.innerHTML = `
<b style="color:${color}">${d.user}</b>
<span style="font-size:12px;color:#666;">(${date})</span>
<br><br>
${d.text || ""}
${d.img ? `<img src="${d.img}">` : ""}
<br><br>
<button onclick="like('${id}')">👍 ${likes}</button>
`;

document.getElementById("posts").prepend(div);

});
}

/* LIKE */
window.like = async function(id){

const postRef = ref(db,"lorem_posts/"+id);
const snap = await get(postRef);
const d = snap.val();

if(!d.likes) d.likes={};

if(d.likes[user]){
alert("Już polubiłeś!");
return;
}

d.likes[user]=true;

await update(postRef,{likes:d.likes});

location.reload();

};

</script>

</body>
</html>
