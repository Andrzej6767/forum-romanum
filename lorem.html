<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem Mentis Romani</title>

<style>
body{
    margin:0;
    font-family:Georgia,serif;
    background:#f4e1c1;
    background-image:url('https://www.transparenttextures.com/patterns/papyrus.png');
    color:#4b2e1e;
}

header{
    background:#d4b483;
    padding:20px;
    text-align:center;
    border-bottom:5px solid #8b5e3c;
}

.post{
    max-width:700px;
    margin:15px auto;
    background:#e6c89f;
    padding:15px;
    border-radius:12px;
    border-left:5px solid #8b5e3c;
}

textarea,input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    padding:10px 15px;
    background:#8b5e3c;
    color:white;
    border:none;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
}

button:hover{
    background:#6f472d;
}

img{
    width:100%;
    margin-top:10px;
    border-radius:10px;
}

.likeBtn{
    margin-top:15px;
}
</style>
</head>

<body>

<header>
<h1>📜 Lorem Mentis Romani</h1>
</header>

<a href="Login.html" style="
display:inline-block;
margin:10px;
padding:10px 15px;
background:#8b5e3c;
color:white;
text-decoration:none;
border-radius:8px;
">
⬅ Powrót
</a>

<div id="blockScreen" style="
display:none;
text-align:center;
padding:50px;
font-size:22px;
color:#8b0000;
font-weight:bold;
">
🚫 Dostęp zablokowany<br>
Wymagane IQ: 140+
</div>

<div id="app" style="display:none;">

<div class="post">

<textarea id="text" placeholder="Napisz coś..."></textarea>

<input type="file" id="file">

<button onclick="post()">📤 Dodaj post</button>

</div>

<div id="posts"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,
ref,
push,
onChildAdded,
get,
update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
authDomain:"dupa-a6aa0.firebaseapp.com",
databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",
projectId:"dupa-a6aa0",
storageBucket:"dupa-a6aa0.firebasestorage.app",
messagingSenderId:"782529996845",
appId:"1:782529996845:web:277ff4fcf6f4db846cf0a4"
});

const db = getDatabase(app);
const user = localStorage.getItem("nickname");

if(!user){
    window.location.href = "index.html";
}

const postsRef = ref(db,"posts");

/* =========================
   🧠 IQ GATE (NOWE)
========================= */

async function checkIQ(){

    const snap = await get(ref(db,"users/" + user));
    const data = snap.val();

    const iq = data?.iq ?? 60;

    if(iq < 140){
        document.getElementById("blockScreen").style.display = "block";
        document.getElementById("app").style.display = "none";
    } else {
        document.getElementById("app").style.display = "block";
    }
}

checkIQ();

/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME = "dqoqromys";
const UPLOAD_PRESET = "forum_upload";

async function uploadToCloudinary(file){

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const res = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        { method:"POST", body:formData }
    );

    const data = await res.json();
    return data.secure_url;
}

/* =========================
   POST
========================= */

window.post = async function(){

    const text = document.getElementById("text").value;
    const file = document.getElementById("file").files[0];

    if(!text.trim() && !file) return;

    let imageUrl = "";

    if(file){
        imageUrl = await uploadToCloudinary(file);
    }

    push(postsRef,{
        user,
        text,
        img:imageUrl,
        time:Date.now(),
        likes:{}
    });

    document.getElementById("text").value="";
    document.getElementById("file").value="";
};

/* =========================
   LOAD POSTS
========================= */

onChildAdded(postsRef, async (snap)=>{

    const id = snap.key;
    const d = snap.val();

    const userSnap = await get(ref(db,"users/" + d.user));
    const userData = userSnap.val() || {};

    const color = userData.color || "#4b2e1e";

    let badge = "";

    if(userData.badges?.fanRomek) badge += "🤑 ";
    if(userData.badges?.gladiator) badge += "⚔ ";

    const date = new Date(d.time);

    const formatted =
        date.toLocaleDateString("pl-PL") + " " +
        date.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});

    const likesCount = Object.keys(d.likes || {}).length;

    const div = document.createElement("div");
    div.classList.add("post");

    div.innerHTML = `
        <b style="color:${color};font-size:18px;">
            ${badge} ${d.user}
        </b>

        <span style="font-size:12px;color:#666;margin-left:8px;">
            (${formatted})
        </span>

        <br><br>

        ${d.text || ""}

        ${d.img ? `<img src="${d.img}">` : ""}

        <br><br>

        <button class="likeBtn" onclick="like('${id}')">
            👍 ${likesCount}
        </button>
    `;

    document.getElementById("posts").prepend(div);
});

/* =========================
   LIKE
========================= */

window.like = async function(id){

    const postRef = ref(db,"posts/" + id);
    const snap = await get(postRef);
    const data = snap.val();

    if(!data.likes) data.likes = {};

    if(data.likes[user]){
        alert("Już polubiłeś ten post!");
        return;
    }

    data.likes[user] = true;

    await update(postRef,{ likes:data.likes });

    location.reload();
};

</script>

</body>
</html>
