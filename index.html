<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum Romanum</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-family:Georgia,serif;
text-align:center;
color:white;

/* 🏛 KOLOSEUM */
background-image:url("https://upload.wikimedia.org/wikipedia/commons/5/5c/Colosseum_in_Rome%2C_Italy_-_April_2007.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

h1{font-size:4rem;}
h2{font-size:1.5rem;}

input{
padding:10px;
border:none;
border-radius:8px;
margin:5px;
width:220px;
}

button{
padding:10px 18px;
border:none;
border-radius:8px;
background:#8b0000;
color:white;
cursor:pointer;
}

button:hover{background:#a00000;}

</style>
</head>

<body>

<h1>Forum Romanum</h1>
<h2>Podaj hasło</h2>

<input id="password" type="password" placeholder="Hasło">

<button onclick="login()">Wejdź</button>

<script>
function login(){
const pass=document.getElementById("password").value;

if(pass==="Tusk123"){
window.location.href="Login.html";
}else{
alert("Błędne hasło!");
}
}
</script>

</body>
</html>
