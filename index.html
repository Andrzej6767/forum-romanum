<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media Romanum</title>

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');
    color: #4b2e1e;
}

header {
    background-color: #d4b483;
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
}

#postForm {
    max-width: 700px;
    margin: 20px auto;
    background: #e6c89f;
    padding: 20px;
    border-radius: 10px;
}

textarea,input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    margin-top: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background-color: #8b5e3c;
    color: white;
    cursor: pointer;
}

#posts {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.post {
    background: #e6c89f;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.post img {
    width: 100%;
    margin-top: 10px;
</html>
