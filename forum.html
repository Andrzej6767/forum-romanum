<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum Romanum</title>

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');
    color: #4b2e1e;
}

/* GÓRA */

header {
    background-color: #d4b483;
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
}

header h1 {
    margin: 0;
    font-size: 2.5rem;
}

/* CHAT */

#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 20px;
}

/* WIADOMOŚĆ */

.message {
    background-color: #e6c89f;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-left: 5px solid #8b5e3c;
    word-wrap: break-word;
}

/* DÓŁ */

.input-area {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background-color: #d4b483;
    padding: 10px;
    box-sizing: border-box;
}

input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

button {
    margin-left: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background-color: #8b5e3c;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #6f472d;
}

/* TELEFON */

@media (max-width: 600px) {

    header h1 {
        font-size: 1.8rem;
    }

    button {
        padding: 12px;
    }
}

</style>
</head>

<body>

<header>
    <h1>🏛 Forum Romanum</h1>
</header>

<div id="chat"></div>

<div class="input-area">

    <input
        type="text"
        id="messageInput"
        placeholder="Napisz wiadomość..."
    >

    <button onclick="sendMessage()">
        Wyślij
    </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",

  authDomain: "dupa-a6aa0.firebaseapp.com",

  databaseURL: "https://dupa-a6aa0-default-rtdb.firebaseio.com",

  projectId: "dupa-a6aa0",

  storageBucket: "dupa-a6aa0.firebasestorage.app",

  messagingSenderId: "782529996845",

  appId: "1:782529996845:web:277ff4fcf6f4db846cf0a4",

  measurementId: "G-RL52CHCF0N"
};

/* START */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const chatRef = ref(db, "messages");

/* WYSYŁANIE */

window.sendMessage = function() {

    const input = document.getElementById("messageInput");

    const text = input.value;

    if(text.trim() !== "") {

        push(chatRef, {
            text: text
        });

        input.value = "";
    }
};

/* ODBIERANIE */

onChildAdded(chatRef, (data) => {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.classList.add("message");

    div.textContent = data.val().text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
});

</script>

</body>
</html>
