<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercator Romanus</title>

<style>

body{
    margin:0;
    font-family:Georgia,serif;
    background:#f4e1c1;
    background-image:url('https://www.transparenttextures.com/patterns/papyrus.png');
    color:#4b2e1e;
}

header{
    background:#d4b483;
    padding:20px;
    text-align:center;
    border-bottom:5px solid #8b5e3c;
}

#topBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
}

.backBtn{
    background:#8b5e3c;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

#coins{
    background:#8b5e3c;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

#merchant{
    max-width:1000px;
    margin:20px auto;
    text-align:center;
}

#merchant img{
    width:260px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

#merchant h2{
    margin-top:15px;
    font-size:2rem;
}

#market{
    max-width:1100px;
    margin:30px auto;
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
    padding:20px;
}

.item{
    background:#e6c89f;
    border-radius:18px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
    border:3px solid #8b5e3c;
    transition:0.25s;
}

.item:hover{
    transform:translateY(-5px) scale(1.02);
}

.itemIcon{
    font-size:60px;
    margin-bottom:15px;
}

.item h3{
    margin:10px 0;
}

.price{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

button{
    margin-top:15px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#8b5e3c;
    color:white;
    cursor:pointer;
    width:100%;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#6f472d;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

#msg{
    text-align:center;
    margin:20px;
    font-size:20px;
    font-weight:bold;
}

@media(max-width:700px){

    #merchant img{
        width:180px;
    }

    #merchant h2{
        font-size:1.5rem;
    }
}

</style>
</head>

<body>

<header>
<h1>🏺 Mercator Romanus</h1>
</header>

<div id="topBar">

<a href="Login.html" class="backBtn">
⬅ Powrót
</a>

<div id="coins">
💵 <span id="coinCount">0</span>
</div>

</div>

<div id="merchant">

<img src="Romek1.png">

<h2>🧔 Kupiec Romulus zaprasza!</h2>

<p>
Witaj podróżniku. Wymień swoje monety na wyjątkowe przedmioty.
</p>

</div>

<div id="market">

<!-- FAN ROMKA -->

<div class="item">

<div class="itemIcon">
🤑
</div>

<h3>Fan Romka</h3>

<p>
Odznaka 🤑 Fan Romka będzie widoczna obok Twojego nicku.
</p>

<div class="price">
💵 1 moneta
</div>

<button id="fanBtn" onclick="buyFan()">
Kup
</button>

</div>

<!-- GLADIATOR -->

<div class="item">

<div class="itemIcon">
⚔
</div>

<h3>Gladiator Romka</h3>

<p>
Specjalna odznaka gladiatora Forum Romanum.
</p>

<div class="price">
💵 1 moneta
</div>

<button id="gladiatorBtn" onclick="buyGladiator()">
Kup
</button>

</div>

</div>

<div id="msg"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get,
update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",

authDomain:"dupa-a6aa0.firebaseapp.com",

databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",

projectId:"dupa-a6aa0",

storageBucket:"dupa-a6aa0.firebasestorage.app",

messagingSenderId:"782529996845",

appId:"1:782529996845:web:277ff4fcf6f4db846cf0a4"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const user =
localStorage.getItem("nickname");

if(!user){

window.location.href = "index.html";
}

const userRef =
ref(db,"users/" + user);

async function loadUser(){

const snap =
await get(userRef);

const data =
snap.val();

if(!data) return;

document.getElementById("coinCount")
.textContent = data.coins || 0;

// FAN ROMKA
if(data.badges?.fanRomek){

const btn =
document.getElementById("fanBtn");

btn.disabled = true;

btn.textContent = "Kupiono";
}

// GLADIATOR
if(data.badges?.gladiator){

const btn =
document.getElementById("gladiatorBtn");

btn.disabled = true;

btn.textContent = "Kupiono";
}
}

loadUser();

/* FAN ROMKA */

window.buyFan = async function(){

const snap =
await get(userRef);

const data =
snap.val();

if(data.badges?.fanRomek){

showMsg("❌ Już posiadasz tę odznakę");

return;
}

if((data.coins || 0) < 1){

showMsg("❌ Masz za mało monet");

return;
}

const badges =
data.badges || {};

badges.fanRomek = true;

await update(userRef,{

coins:(data.coins || 0) - 1,

badges:badges
});

showMsg("🤑 Kupiono Fan Romka!");

loadUser();
};

/* GLADIATOR */

window.buyGladiator = async function(){

const snap =
await get(userRef);

const data =
snap.val();

if(data.badges?.gladiator){

showMsg("❌ Już posiadasz tę odznakę");

return;
}

if((data.coins || 0) < 1){

showMsg("❌ Masz za mało monet");

return;
}

const badges =
data.badges || {};

badges.gladiator = true;

await update(userRef,{

coins:(data.coins || 0) - 1,

badges:badges
});

showMsg("⚔ Kupiono Gladiator Romka!");

loadUser();
};

function showMsg(text){

const msg =
document.getElementById("msg");

msg.textContent = text;

setTimeout(()=>{

msg.textContent = "";

},3000);
}

</script>

</body>
</html>
