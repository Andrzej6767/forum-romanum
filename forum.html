<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum Romanum</title>

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');
    color: #4b2e1e;
}

header {
    background-color: #d4b483;
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
}

#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 20px;
}

.message {
    background: #e6c89f;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-left: 5px solid #8b5e3c;
}

.input {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    padding: 10px;
    background: #d4b483;
    box-sizing: border-box;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
}

button {
    margin-left: 10px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #8b5e3c;
    color: white;
}

</style>
</head>

<body>

<header>
    <h1>🏛 Forum Romanum</h1>
</header>

<div id="chat"></div>

<div class="input">

    <input id="msg" placeholder="Napisz wiadomość...">

    <button onclick="send()">Wyślij</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    get,
    update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
  authDomain: "dupa-a6aa0.firebaseapp.com",
  databaseURL: "https://dupa-a6aa0-default-rtdb.firebaseio.com",
  projectId: "dupa-a6aa0",
  storageBucket: "dupa-a6aa0.firebasestorage.app",
  messagingSenderId: "782529996845",
  appId: "1:782529996845:web:277ff4fcf6f4db846cf0a4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const user = localStorage.getItem("nickname");

const chatRef = ref(db, "messages");

/* SEND */

window.send = function() {

    const text = document.getElementById("msg").value;

    if(text.trim() === "") return;

    push(chatRef, {
        text,
        user,
        time: Date.now()
    });

    document.getElementById("msg").value = "";
};

/* LOAD */

onChildAdded(chatRef, (snap) => {

    const data = snap.val();

    const div = document.createElement("div");

    div.classList.add("message");

    div.innerHTML = `
        <b>${data.user}</b><br>
        ${data.text}
    `;

    document.getElementById("chat").appendChild(div);
});

/* MONETY ZA CHAT (prosty system) */

window.addCoin = async function(targetUser) {

    const userRef = ref(db, "users/" + targetUser);

    const snap = await get(userRef);

    if(!snap.exists()) return;

    const data = snap.val();

    await update(userRef, {
        coins: (data.coins || 0) + 1
    });
};

</script>

</body>
</html>
