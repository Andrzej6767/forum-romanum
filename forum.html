<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum Romanum</title>

<style>
body{
    margin:0;
    font-family:Georgia,serif;
    background:#f4e1c1;
    background-image:url('https://www.transparenttextures.com/patterns/papyrus.png');
    color:#4b2e1e;
}

header{
    background:#d4b483;
    padding:20px;
    text-align:center;
    border-bottom:5px solid #8b5e3c;
}

#chat{
    height: calc(100vh - 160px);
    overflow-y:auto;
    padding:20px;
    padding-bottom:120px; /* kluczowa poprawka */
    box-sizing:border-box;
}

.message{
    background:#e6c89f;
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    border-left:5px solid #8b5e3c;
}

.input{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    display:flex;
    padding:10px;
    background:#d4b483;
    box-sizing:border-box;
    border-top:2px solid #8b5e3c;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
}

button{
    margin-left:10px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#8b5e3c;
    color:white;
}
</style>
</head>

<body>

<header>
<h1>🏛 Forum Romanum</h1>
</header>

<a href="Login.html" style="display:inline-block;margin:10px;padding:10px 15px;background:#8b5e3c;color:white;text-decoration:none;border-radius:8px;">
⬅ Powrót
</a>

<div id="chat"></div>

<div class="input">
<input id="msg" placeholder="Napisz wiadomość...">
<button onclick="send()">Wyślij</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
authDomain:"dupa-a6aa0.firebaseapp.com",
databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",
projectId:"dupa-a6aa0",
storageBucket:"dupa-a6aa0.firebasestorage.app",
messagingSenderId:"782529996845",
appId:"1:782529996845:web:277ff4fcf6f4db846cf0a4"
};

const db=getDatabase(initializeApp(firebaseConfig));
const user=localStorage.getItem("nickname");
const chatRef=ref(db,"messages");

window.send=function(){
const text=document.getElementById("msg").value;
if(!text.trim())return;

push(chatRef,{
user,
text,
time:Date.now()
});

document.getElementById("msg").value="";
};

const chat = document.getElementById("chat");

onChildAdded(chatRef,(snap)=>{

const data=snap.val();

const date=new Date(data.time);
const formatted=
date.toLocaleDateString("pl-PL")+" "+
date.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});

const div=document.createElement("div");
div.classList.add("message");

div.innerHTML=`
<b>${data.user}</b>
<span style="font-size:12px;color:#555;">(${formatted})</span>
<br><br>
${data.text}
`;

chat.appendChild(div);
chat.scrollTop = chat.scrollHeight; // auto-scroll
});

function applyTheme(){
const theme=localStorage.getItem("theme");

if(theme==="dark"){
document.body.style.backgroundColor="#111";
document.body.style.color="#fff";
}
}

applyTheme();
</script>

</body>
</html>
