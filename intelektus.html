<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Intelektus Romanus</title>

<style>
body{
    font-family: Georgia, serif;
    background:#f4e1c1;
    text-align:center;
    padding:20px;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;
    background:#8b5e3c;
    color:white;
    padding:10px;
    border-radius:10px;
}

button{
    padding:12px;
    margin:8px;
    width:250px;
    border:none;
    border-radius:10px;
    background:#8b5e3c;
    color:white;
    cursor:pointer;
}

button:hover{ background:#6f472d; }

#box{
    margin-top:80px;
}

#exit{
    position:fixed;
    top:10px;
    right:10px;
    background:red;
}
</style>
</head>

<body>

<div id="hud">
🧠 IQ: <span id="iq">--</span>
</div>

<button id="exit" onclick="location.href='Login.html'">⬅ Wyjście</button>

<h1>Intelektus Romanus</h1>

<div id="box">
Ładowanie...
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
authDomain:"dupa-a6aa0.firebaseapp.com",
databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",
projectId:"dupa-a6aa0"
});

const db = getDatabase(app);

const nickname = localStorage.getItem("nickname");

const box = document.getElementById("box");

if(!nickname){
    box.innerHTML = "Brak użytkownika";
}

/* ===== PYTANIA ===== */

const questions = [
{q:"Kto jest najśliniejszym człowiekiem na ziemi?", a:["Romek"]},
{q:"Ile to 2+2?", a:["3","4","5","6"], c:"4"},
{q:"Stolica Polski?", a:["Warszawa","Kraków","Gdańsk"], c:"Warszawa"},
{q:"Ile to 10*10?", a:["100","10","110"], c:"100"},
{q:"Jaki kolor powstaje z czerwonego i niebieskiego?", a:["Fioletowy","Zielony"], c:"Fioletowy"}
];

/* ===== SAFE USER LOAD ===== */

async function getUser(){

    try{
        const snap = await get(ref(db,"users/"+nickname));
        return snap.val() || {iq:60};
    } catch(e){
        return {iq:60};
    }
}

/* ===== LOAD UI ===== */

async function start(){

    const user = await getUser();

    document.getElementById("iq").innerText = user.iq ?? 60;

    const q = questions[Math.floor(Math.random()*questions.length)];

    box.innerHTML = `<h2>${q.q}</h2>`;

    const answers = q.a;

    answers.forEach(ans=>{

        const btn = document.createElement("button");
        btn.innerText = ans;

        btn.onclick = async () => {

            let iq = user.iq ?? 60;

            const correct = (ans === (q.c || q.a[0]));

            if(correct) iq += 20;
            else iq -= 20;

            if(iq < 40) iq = 40;

            try{
                await update(ref(db,"users/"+nickname),{iq});
            }catch(e){
                console.log("update error",e);
            }

            box.innerHTML = `
                <h2>${correct ? "✔ dobrze" : "❌ źle"}</h2>
                <p>IQ: ${iq}</p>
                <button onclick="location.reload()">Dalej</button>
            `;

            document.getElementById("iq").innerText = iq;
        };

        box.appendChild(btn);
    });
}

start();

</script>

</body>
</html>
