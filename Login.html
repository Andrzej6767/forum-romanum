<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forum Romanum</title>

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: Georgia, serif;

            background-color: #f4e1c1;
            background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');

            color: #4b2e1e;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        a {
            display: inline-block;

            padding: 14px 24px;

            background-color: #d4b483;

            border: 2px solid #8b5e3c;

            border-radius: 8px;

            text-decoration: none;

            color: #4b2e1e;

            font-weight: bold;

            transition: 0.3s;
        }

        a:hover {
            background-color: #caa26f;
            transform: scale(1.05);
        }

    </style>
</head>

<body>

    <h1>🏛 Forum Romanum</h1>

    <p>
        Witaj w Imperium Romka.  
        Przejdź do forum lub sprawdź kalendarz Imperium.
    </p>

    <div class="buttons">

        <a href="forum.html">
            🏛 Forum
        </a>

        <a href="kalendarz.html">
            📅 Kalendarz
        </a>

    </div>

</body>
</html>
