<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum Romanum</title>

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');
    color: #4b2e1e;
}

body.dark {
    background-color: #1e1e1e;
    color: white;
}

header {
    background-color: #d4b483;
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
}

body.dark header {
    background: #333;
}

header h1 {
    margin: 0;
    font-size: 2.5rem;
}

nav {
    margin-top: 15px;
}

nav a {
    display: inline-block;
    margin: 10px;
    padding: 10px 18px;
    background-color: #e6c89f;
    border: 2px solid #8b5e3c;
    border-radius: 8px;
    text-decoration: none;
    color: #4b2e1e;
    font-weight: bold;
}

#settingsBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 28px;
    cursor: pointer;
}

#settingsPanel {
    position: fixed;
    top: 0;
    right: -320px;
    width: 300px;
    height: 100%;
    background: #d4b483;
    padding: 20px;
    transition: 0.3s;
}

#settingsPanel.open {
    right: 0;
}

#settingsPanel input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
</html>
