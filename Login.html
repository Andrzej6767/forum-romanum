<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum Romanum</title>

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url("https://upload.wikimedia.org/wikipedia/commons/5/5c/Colosseum_in_Rome%2C_Italy_-_April_2007.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #4b2e1e;
}

/* HEADER */
header {
    background-color: rgba(212,180,131,0.95);
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
    position: relative;
}

header h1 {
    margin: 0;
    font-size: 2.5rem;
}

/* DASHBOARD */
.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 25px;
    padding: 35px;
}

.card {
    background: rgba(230,200,159,0.92);
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
}

.card a {
    text-decoration: none;
    color: inherit;
    font-size: 1.2rem;
    font-weight: bold;
}

/* INFO */
.info {
    text-align: center;
    margin-top: 20px;
    font-size: 1.3rem;
    font-weight: bold;
}

/* HUD */
#hud {
    position: fixed;
    bottom: 15px;
    left: 15px;
    background: #8b5e3c;
    color: white;
    padding: 10px 15px;
    border-radius: 12px;
    font-weight: bold;
}

/* RANKING */
#ranking {
    max-width: 700px;
    margin: 20px auto;
    background: rgba(230,200,159,0.9);
    padding: 15px;
    border-radius: 12px;
}

.rankItem {
    display:flex;
    justify-content:space-between;
    padding:8px;
}

</style>
</head>

<body>

<header>
<h1>🏛 Forum Romanum</h1>
</header>

<div class="info">
Witaj, <span id="nick"></span>
</div>

<div class="dashboard">

<div class="card"><a href="forum.html">🏛 Sklep</a></div>
<div class="card"><a href="media.html">🏺 Media</a></div>
<div class="card"><a href="casino.html">💰 Kasyno</a></div>

<div class="card"><a href="intelektus.html">🧠 Intelektus Romanus</a></div>

<div class="card" onclick="openLorem()">
📜 Lorem Mentis Romani
</div>

</div>
    <div class="card">
    <a href="arena.html">
        ⚔ Arena Romanum
    </a>
    </div>

<!-- HUD -->
<div id="hud">
🪙 <span id="coins">0</span> | 🧠 <span id="iq">60</span>
</div>

<!-- RANKING -->
<div id="ranking">
<h3>🏆 Ranking Imperium</h3>
<div id="rankList"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
apiKey:"AIzaSyD5wKZf1d_AE8j4CAmkLwXouFzU8BjVQTg",
authDomain:"dupa-a6aa0.firebaseapp.com",
databaseURL:"https://dupa-a6aa0-default-rtdb.firebaseio.com",
projectId:"dupa-a6aa0",
storageBucket:"dupa-a6aa0.firebasestorage.app",
messagingSenderId:"782529996845",
appId:"1:782529996845:web:277ff4fcf6f4db846cf0a4"
});

const db = getDatabase(app);
const user = localStorage.getItem("nickname");

if(!user) window.location.href="index.html";

const userRef = ref(db,"users/"+user);

/* LOAD USER */
async function load(){

const snap = await get(userRef);
const data = snap.val() || {coins:0, iq:60, badges:{}};

document.getElementById("nick").innerText = user;
document.getElementById("coins").innerText = data.coins || 0;
document.getElementById("iq").innerText = data.iq || 60;

}
load();

/* RANKING */
async function ranking(){

const snap = await get(ref(db,"users"));
const data = snap.val();

let arr=[];

for(let u in data){
arr.push({
nick:u,
coins:data[u].coins||0,
iq:data[u].iq||60
});
}

arr.sort((a,b)=>b.coins-a.coins);

const list = document.getElementById("rankList");
list.innerHTML="";

arr.slice(0,10).forEach((u,i)=>{

let medal = i==0?"🥇":i==1?"🥈":i==2?"🥉":"";

list.innerHTML += `
<div class="rankItem">
<span>${medal} ${u.nick}</span>
<span>🪙 ${u.coins} | 🧠 ${u.iq}</span>
</div>
`;

});

}
ranking();

/* LOREM BLOCK */
window.openLorem = async function(){

const snap = await get(userRef);
const data = snap.val();

if((data.iq||60) < 140){
alert("❌ Wymagane 140 IQ");
return;
}

window.location.href="lorem.html";

};

</script>

</body>
</html>
