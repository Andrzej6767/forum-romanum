<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum Romanum</title>

<style>

/* ===== BASE ===== */

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');
    color: #4b2e1e;
}

/* ===== HEADER ===== */

header {
    background-color: #d4b483;
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
}

header h1 {
    margin: 0;
    font-size: 2.5rem;
}

/* ===== NAV BUTTONS ===== */

nav {
    margin-top: 15px;
}

nav a {
    display: inline-block;
    margin: 10px;
    padding: 10px 18px;
    background-color: #e6c89f;
    border: 2px solid #8b5e3c;
    border-radius: 8px;
    text-decoration: none;
    color: #4b2e1e;
    font-weight: bold;
    transition: 0.2s;
}

nav a:hover {
    transform: scale(1.05);
}

/* ===== SETTINGS BUTTON ===== */

#settingsBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 28px;
    cursor: pointer;
    z-index: 1000;
}

/* ===== SETTINGS PANEL ===== */

#settingsPanel {
    position: fixed;
    top: 0;
    right: -320px;
    width: 300px;
    height: 100%;
    background: #d4b483;
    padding: 20px;
    box-shadow: -5px 0 15px rgba(0,0,0,0.3);
    transition: 0.3s;
    z-index: 999;
}

#settingsPanel.open {
    right: 0;
}

#settingsPanel input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border: none;
    border-radius: 6px;
}

button {
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #8b5e3c;
    color: white;
    cursor: pointer;
}

/* ===== DARK MODE ===== */

body.dark {
    background-color: #1e1e1e;
    color: white;
}

body.dark header {
    background: #333;
}

body.dark nav a {
    background: #444;
    color: white;
}

body.dark #settingsPanel {
    background: #333;
    color: white;
}

</style>
</head>

<body>

<!-- ===== ZĘBATKA ===== -->
<div id="settingsBtn">⚙️</div>

<!-- ===== PANEL ===== -->
<div id="settingsPanel">

    <h2>Ustawienia</h2>

    <label>Nick</label>
    <input id="nickInput" placeholder="Nowy nick">
    <button onclick="changeNick()">Zmień nick</button>

    <hr>

    <label>Kolor nicku</label>
    <input type="color" id="colorInput">
    <button onclick="changeColor()">Zapisz kolor</button>

    <hr>

    <button onclick="toggleTheme()">🌙 Tryb ciemny/jasny</button>

    <hr>

    <h3>Statystyki</h3>
    <div id="stats">Brak danych</div>

</div>

<!-- ===== HEADER ===== -->

<header>

    <h1>🏛 Forum Romanum</h1>

    <nav>
        <a href="forum.html">Forum</a>
        <a href="media.html">Media Romanum</a>
        <a href="kalendarz.html">Kalendarz</a>
    </nav>

</header>

<script>

/* ===== OPEN PANEL ===== */

const panel = document.getElementById("settingsPanel");

document.getElementById("settingsBtn").onclick = () => {
    panel.classList.toggle("open");
};

/* ===== NICK ===== */

function changeNick() {
    const nick = document.getElementById("nickInput").value;
    if(!nick) return;
    localStorage.setItem("nickname", nick);
    alert("Nick zmieniony!");
}

/* ===== COLOR ===== */

function changeColor() {
    const color = document.getElementById("colorInput").value;
    localStorage.setItem("nickColor", color);
    alert("Kolor zapisany!");
}

/* ===== THEME ===== */

function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("dark", document.body.classList.contains("dark"));
}

/* load theme */

if(localStorage.getItem("dark") === "true") {
    document.body.classList.add("dark");
}

/* ===== STATS (placeholder) ===== */

document.getElementById("stats").innerHTML =
`
Nick: ${localStorage.getItem("nickname") || "Anonim"}<br>
Kolor: ${localStorage.getItem("nickColor") || "domyślny"}
`;

</script>

</body>
</html>
