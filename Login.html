<!DOCTYPE html>
<html lang="pl">
<head>

    <title>Forum Romanum</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: Georgia, serif;
            background-color: #f4e1c1;
            background-image: url('https://www.transparenttextures.com/patterns/papyrus.png');
            color: #4b2e1e;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
        }

        a {
            margin-top: 20px;
            display: inline-block;
            padding: 12px 20px;
            background-color: #d4b483;
            border: 2px solid #8b5e3c;
            border-radius: 8px;
            text-decoration: none;
            color: #4b2e1e;
            font-weight: bold;
        }

        a:hover {
            background-color: #caa26f;
        }
    </style>
</head>
