<!DOCTYPE html>
<html lang="pl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forum Romanum</title>

<style>

body {
    margin: 0;
    font-family: Georgia, serif;
    background-color: #f4e1c1;
    background-image: url("https://upload.wikimedia.org/wikipedia/commons/5/5c/Colosseum_in_Rome%2C_Italy_-_April_2007.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #4b2e1e;
    transition: 0.3s;
}

body.dark {
    background-color: #1e1e1e;
    background-image: none;
    color: white;
}

header {
    background-color: rgba(212,180,131,0.95);
    padding: 20px;
    text-align: center;
    border-bottom: 5px solid #8b5e3c;
    position: relative;
}

body.dark header {
    background: rgba(30,30,30,0.95);
}

header h1 {
    margin: 0;
    font-size: 2.5rem;
}

#settingsBtn {
    position: absolute;
    top: 18px;
    right: 20px;
    font-size: 28px;
    cursor: pointer;
}

#settingsPanel {
    position: fixed;
    top: 0;
    right: -340px;
    width: 320px;
    height: 100%;
    background: #d4b483;
    padding: 20px;
    box-sizing: border-box;
    transition: 0.3s;
    overflow-y: auto;
    z-index: 999;
}

body.dark #settingsPanel {
    background: #2a2a2a;
}

#settingsPanel.open {
    right: 0;
}

#settingsPanel input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    margin-top: 10px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background-color: #8b5e3c;
    color: white;
    cursor: pointer;
    width: 100%;
}

button:hover {
    background-color: #6f472d;
}

.info {
    text-align: center;
    margin-top: 25px;
    font-size: 1.3rem;
    font-weight: bold;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 25px;
    padding: 35px;
}

.card {
    background: rgba(230,200,159,0.92);
    padding: 35px;
    border-radius: 18px;
    text-align: center;
    transition: 0.25s;
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
}

body.dark .card {
    background: rgba(40,40,40,0.95);
}

.card:hover {
    transform: translateY(-5px) scale(1.02);
}

.card a {
    text-decoration: none;
    color: inherit;
    font-size: 1.3rem;
    font-weight: bold;
}

@media(max-width:600px){
    .dashboard{ grid-template-columns:1fr; }
    header h1{ font-size:2rem; }
}

/* HUD */
#coinHud{
    position:fixed;
    bottom:15px;
    left:15px;
    background:rgba(139,94,60,0.95);
    color:white;
    padding:10px 14px;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
    z-index:1000;
}

</style>
</head>

<body>

<header>
    <h1>🏛 Forum Romanum</h1>
    <div id="settingsBtn">⚙️</div>
</header>

<div class="info">
    Witaj, <span id="nickDisplay"></span>
</div>

<div class="dashboard">

    <div class="card"><a href="forum.html">🏛 Sklep Romka</a></div>
    <div class="card"><a href="media.html">🏺 Media Romanum</a></div>
    <div class="card"><a href="kalendarz.html">📅 Kalendarz</a></div>
    <div class="card"><a href="casino.html">💰 Ova aurea Romani</a></div>

    <!-- 🧠 NOWE -->
    <div class="card"><a href="intelektus.html">🧠 Intelektus Romanus</a></div>
    <div class="card"><a href="lorem.html">📜 Lorem Mentis Romani</a></div>

</div>

<div id="settingsPanel">

    <h2>⚙️ Ustawienia</h2>
    <hr>

    <h3>👤 Profil</h3>
    <div id="profileInfo"></div>

    <hr>

    <label>Kolor nicku</label>
    <input type="color" id="colorPicker">

    <button onclick="saveColor()">🎨 Zapisz kolor</button>

    <hr>

    <button onclick="toggleTheme()">🌙 Tryb ciemny/jasny</button>
    <hr>

    <button onclick="logout()">🚪 Wyloguj</button>
    <hr>

    <button onclick="closePanel()">❌ Zamknij</button>

</div>

<!-- 🪙 HUD -->
<div id="coinHud">
    💵 <span id="coinCount">0</span>
    | 🧠 <span id="iqCount">60</span>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    get,
    update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5wKZf1d_AE8e...",
  authDomain: "dupa-a6aa0.firebaseapp.com",
  databaseURL: "https://dupa-a6aa0-default-rtdb.firebaseio.com",
  projectId: "dupa-a6aa0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const nickname = localStorage.getItem("nickname");

if(!nickname){
    window.location.href = "index.html";
}

const panel = document.getElementById("settingsPanel");

document.getElementById("settingsBtn").onclick = () => {
    panel.classList.toggle("open");
};

window.closePanel = () => panel.classList.remove("open");

async function ensureUser(){

    const snap = await get(ref(db, "users/" + nickname));
    const user = snap.val();

    if(!user || user.iq === undefined){

        await update(ref(db, "users/" + nickname), {
            iq: 60,
            lastIqDecay: Date.now(),
            lastQuizDate: null,
            quizTodayCount: 0
        });
    }
}

async function loadProfile(){

    const snap = await get(ref(db, "users/" + nickname));
    const user = snap.val() || {};

    document.getElementById("nickDisplay").innerHTML = `
        <span style="color:${user.color || "#4b2e1e"}">
            ${user.badge || ""}
            ${nickname}
        </span>
    `;

    document.getElementById("profileInfo").innerHTML = `
        <b>Nick:</b> ${nickname}
        <br><br>
        <b>Odznaka:</b> ${user.badge || "Brak"}
        <br><br>
        <b>IQ:</b> ${user.iq ?? 60}
    `;

    document.getElementById("colorPicker").value =
    user.color || "#4b2e1e";

    document.getElementById("coinCount").textContent =
    user.coins || 0;

    document.getElementById("iqCount").textContent =
    user.iq ?? 60;
}

window.saveColor = async () => {

    const color = document.getElementById("colorPicker").value;

    await update(ref(db, "users/" + nickname), {
        color
    });

    loadProfile();
};

window.toggleTheme = () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("dark", document.body.classList.contains("dark"));
};

if(localStorage.getItem("dark") === "true"){
    document.body.classList.add("dark");
}

window.logout = () => {
    localStorage.clear();
    window.location.href = "index.html";
};

ensureUser().then(loadProfile);

</script>

</body>
</html>
